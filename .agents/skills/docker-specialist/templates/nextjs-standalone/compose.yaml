services:
  app:
    container_name: nextjs-app
    image: nextjs-app:dev
    build:
      context: .
      # Use Dockerfile.dev for live development, or Dockerfile for production standalone builds
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    # Intelligent environment hierarchy: .env provides base defaults, .env.local overrides
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://appuser:apppass@db:5432/appdb}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # Sync frontend source code changes directly for immediate Fast Refresh
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        # Trigger an image rebuild when package dependencies change
        - action: rebuild
          path: ./package.json

  db:
    container_name: nextjs-db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppass}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
